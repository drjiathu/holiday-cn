[tool.poetry]
name = "holiday-cn"
version = "0.1.0"
description = "A Python package for Chinese Public Holidays"
authors = ["drjiathu <xiaowei.jia@outlook.com>"]
license = "MIT"
readme = "README.md"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
beautifulsoup4 = "^4.12.3"
requests = "^2.32.3"
icalendar = "^5.0.13"
pymongo = "^4.8.0"
tqdm = "^4.66.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
coverage = "^7.0.0"
flake8 = "^7.0.0"

[tool.poetry.scripts]
holiday-cn = "holiday_cn.entry:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
