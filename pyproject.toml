[tool.poetry]
name = "holiday-cn"
version = "1.0.0"
description = "A Python package for Chinese Public Holidays"
authors = ["drjiathu <xiaowei.jia@outlook.com>"]
license = "MIT"
readme = "README.md"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
beautifulsoup4 = "^4.12.3"
requests = "^2.32.3"
icalendar = "^5.0.13"
tqdm = "^4.66.4"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
coverage = "^7.0.0"
flake8 = "^7.0.0"
httpx = "^0.28.0"
black = "^26.1.0"

[tool.poetry.scripts]
holiday-cn = "holiday_cn.entry:cli"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.coverage.run]
omit = ["*/site-packages/*", "*/tests/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
